name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/repository-catalog/.github/workflows/release-plan.yml@eb10e8f1e32932e24587919fb6b0d427271e0ed6 # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/repository-catalog/.github/workflows/release-readiness.yml@eb10e8f1e32932e24587919fb6b0d427271e0ed6 # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: check / Check

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: python github:please-behave/cli
          experimental: true
          version: 2026.11.11
      - name: Verify the candidate at the release point
        uses: christianpflugradt/repository-catalog/actions/release/governance@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
      - name: Package verified native candidate
        run: mise run package
      - name: Record release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: macos

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: python node
          experimental: true
          version: 2026.11.11
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/repository-catalog/actions/release/evidence@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Checksum the app archive
        working-directory: dist
        run: shasum -a 256 -- Passing-By-*.zip > SHA256SUMS
      - name: Publish versioned app and release notes
        uses: christianpflugradt/repository-catalog/actions/release/publish-release@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          source-sha: ${{ needs.plan.outputs.source_sha }}
          gateway-url: ${{ secrets.GATEWAY_URL }}
          force: ${{ inputs.force }}
          assets: |
            dist/Passing-By-*.zip
            dist/SHA256SUMS
