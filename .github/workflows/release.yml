name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Semantic Release verifies push access during a dry run
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - run: npm ci --ignore-scripts
      - name: Plan next semantic release without publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:plan

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - run: npm ci --ignore-scripts
      - name: Prepare validation tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Prepare Gitleaks and actionlint
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install pinned published governor in the checkout
        run: |
          python3 Scripts/install-governor.py
          echo "$PWD/.tools/please/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Rule Sets and provider
        run: please sync --yes
      - name: Verify release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: please run --at release-readiness --checks-only
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - run: npm ci --ignore-scripts
      - name: Install pinned published governor in the checkout
        run: |
          python3 Scripts/install-governor.py
          echo "$PWD/.tools/please/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Rule Sets and provider
        run: please sync --yes
      - name: Validate and package native candidate
        run: please run --at release-candidate --checks-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passing-by-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passing-by-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: dist
          merge-multiple: true
      - name: Verify collected release artifact without rebuilding
        run: python3 Scripts/release-artifacts.py verify
      - name: Publish versioned app and release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm run release
