name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release a patch version even if no commit would raise the version, to test the release process
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-plan.yml@95293131bd2673933aa8b97348b90486e07e431e # updates/workflows/release
    with:
      force: ${{ inputs.force }}

  release-readiness:
    name: Release Readiness
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    uses: christianpflugradt/please-behave-governance/.github/workflows/release-readiness.yml@95293131bd2673933aa8b97348b90486e07e431e # updates/workflows/release
    with:
      source-sha: ${{ needs.plan.outputs.source_sha }}
      required-jobs: Check
      timeout-minutes: 20

  release-candidate:
    name: Release Candidate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python github:please-behave/cli
      - name: Validate native candidate
        uses: please-behave/action@9a184e405e62a79154989de1e54c54869180751b # v1.5.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: release
          summary: 'true'
      - name: Package verified native candidate
        run: mise run package
      - name: Verify candidate archive
        run: python3 .github/scripts/release-artifacts.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passing-by-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Record release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@bebfa9c1b717c64c49f677c0a2d2e4730d86515d # updates/actions/release
        with:
          operation: record
          version: ${{ needs.plan.outputs.version }}
          target: macos

  publish:
    name: Publish
    needs: [plan, release-readiness, release-candidate]
    if: >-
      needs.plan.outputs.release == 'true' &&
      needs.release-readiness.result == 'success' &&
      needs.release-candidate.result == 'success'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: passing-by-${{ github.run_id }}-${{ github.run_attempt }}-macos
          path: dist
          merge-multiple: true
      - name: Verify collected release artifact without rebuilding
        run: python3 .github/scripts/release-artifacts.py verify
      - name: Verify complete release candidate evidence
        uses: christianpflugradt/please-behave-governance/actions/release/evidence@bebfa9c1b717c64c49f677c0a2d2e4730d86515d # updates/actions/release
        with:
          operation: verify
          version: ${{ needs.plan.outputs.version }}
      - name: Publish versioned app and release notes
        uses: christianpflugradt/please-behave-governance/actions/release/publish@bebfa9c1b717c64c49f677c0a2d2e4730d86515d # updates/actions/release
        with:
          version: ${{ needs.plan.outputs.version }}
          force: ${{ inputs.force }}
          assets: |
            dist/Passing-By-*.zip
            dist/SHA256SUMS
            dist/metadata.json
