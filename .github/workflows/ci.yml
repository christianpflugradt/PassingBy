name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - run: npm ci --ignore-scripts
      - name: Prepare validation tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Prepare Gitleaks and actionlint
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install pinned published governor in the checkout
        run: |
          python3 Scripts/install-governor.py
          echo "$PWD/.tools/please/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Rule Sets and provider
        run: please sync --yes
      - name: Run Please Behave checks
        run: please run --at check --checks-only
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-macos
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
