name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  check:
    name: Check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Fetch locked dependencies
        run: mise run prepare
      - name: Run Please Behave checks and applicable reviews
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: please-behave/action@196e1d61f898e0cb77c58ab3dd6667f021321d5e # v1.3.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: check
          summary: 'true'
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-macos
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: warn
