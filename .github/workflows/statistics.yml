name: Statistics
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  collect:
    name: Collect statistics
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Python and scc
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python aqua:boyter/scc
          experimental: true
          version: 2026.11.11
      - name: Run tests with coverage instrumentation
        run: |
          set -euo pipefail
          mkdir -p build/statistics
          swift build --product PassingByTests -Xswiftc -profile-generate -Xswiftc -profile-coverage-mapping
          bin_path="$(swift build --show-bin-path)"
          LLVM_PROFILE_FILE="$PWD/build/coverage.profraw" "$bin_path/PassingByTests" | tee build/test-output.txt
          xcrun llvm-profdata merge -sparse build/coverage.profraw -o build/coverage.profdata
          xcrun llvm-cov export --summary-only -instr-profile=build/coverage.profdata "$bin_path/PassingByTests" \
            Sources/PassingByCore >build/coverage-export.json
      - name: Write coverage metrics
        run: python3 .github/scripts/write-coverage-metrics.py build/coverage-export.json build/statistics
      - name: Write lines of code and test count metrics
        run: |
          scc --format json --include-ext swift Sources/PassingByApp Sources/PassingByCore >build/scc.json
          python3 .github/scripts/write-count-metrics.py build/scc.json build/test-output.txt build/statistics
      - name: Upload statistics metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: statistics-metrics
          path: build/statistics
          if-no-files-found: error

  publish:
    name: Publish statistics
    needs:
      - collect
    if: github.ref == 'refs/heads/main'
    uses: christianpflugradt/repository-catalog/.github/workflows/statistics-publish.yml@19e626fc8f927a8d909d6d7c11761096294b22c0 # updates/workflows/statistics
    with:
      project: passingby
    secrets:
      STATISTICS_TOKEN: ${{ secrets.STATISTICS_TOKEN }}
