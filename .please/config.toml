project = "Passing By"
max_display_files = 5

[execution]
fail_fast_terminate_running_instances = false

[execution_points]
custom = ["release"]

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/repository-conventions"
ref = "1d4c8b94972e77ca6f38d3ea08af093771ff296d"

[imports.rule_parameters.agents-size]
max_tokens = "1500"

[imports.rule_parameters.commit-message]
scopes_file = ".please/commit-scopes.txt"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/security"
ref = "1d4c8b94972e77ca6f38d3ea08af093771ff296d"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/open-source-software"
ref = "1d4c8b94972e77ca6f38d3ea08af093771ff296d"

[imports.rule_parameters.license]
target = "LICENSE"

[[imports]]
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "rulesets/releasable-open-source-software"
ref = "1d4c8b94972e77ca6f38d3ea08af093771ff296d"

[imports.rule_parameters.semantic-release]
tag_format = "v${version}"

[[provider_imports]]
id = "gemini-flash-lite"
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "providers/gemini-flash-lite"
ref = "1d4c8b94972e77ca6f38d3ea08af093771ff296d"

[[provider_imports]]
id = "gemini-flash"
git = "https://github.com/christianpflugradt/please-behave-governance.git"
path = "providers/gemini-flash"
ref = "1d4c8b94972e77ca6f38d3ea08af093771ff296d"
