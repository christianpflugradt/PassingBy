[tools]
"github:please-behave/cli" = "0.8.0"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks.build]
description = "Build a local macOS app bundle"
run = "./tools/build-release.sh"

[tasks.compile]
description = "Compile the release application without assembling the bundle"
run = "swift build -c release --product PassingByApp"

[tasks.lint]
description = "Check Swift formatting and style without changing files"
run = "swift format lint --strict --recursive Sources .please Package.swift"

[tasks.format]
description = "Apply the repository Swift formatting rules"
run = "swift format format --in-place --recursive Sources .please Package.swift"

[tasks.test-domain]
description = "Test filtering, retention and domain rules"
run = "swift run PassingByTests --suite domain"

[tasks.test-persistence]
description = "Test persistence, compatibility and data safety"
run = "swift run PassingByTests --suite persistence"

[tasks.test-editor]
description = "Test Markdown and smart substitutions"
run = "swift run PassingByTests --suite editor"

[tasks.test]
description = "Run the Swift unit tests"
run = "swift run PassingByTests"

[tasks.test-ui]
description = "Run native Settings keyboard and UI tests (macOS desktop)"
run = "./.please/checks/native-ui/test-settings-navigation.sh"

[tasks.package]
description = "ZIP the verified versioned macOS release app (requires RELEASE_VERSION)"
run = "./tools/package-release.sh"

[tasks.release]
description = "Trigger the manual GitHub release workflow"
run = "gh workflow run release.yml --ref main"

[tasks.check]
description = "Run the complete local Please Behave gate"
run = "please run --at pre-push"

[tasks."ci:prepare"]
alias = "setup"
description = "Prepare locked release-tooling dependencies before Git hooks"
run = "npm ci --ignore-scripts"
