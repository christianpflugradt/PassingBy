[tools]
"github:please-behave/cli" = "0.9.0"
node = "26.13.0"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
gh = "2.103.3"
ruff = "0.17.4"
shfmt = "3.14.1"

[tasks.build]
description = "Build a local macOS app bundle"
run = "./tools/build-release.sh"

[tasks.format]
description = "Format Swift, Python and shell sources"
run = [
  "swift format format --in-place --recursive Sources .please Package.swift",
  "ruff format",
  "git ls-files '*.sh' | xargs grep -L '^#!.*zsh' | xargs shfmt -w",
]

[tasks.test-ui]
description = "Run native Settings keyboard and UI tests (macOS desktop)"
run = "./.please/checks/ui-tests/test-settings-navigation.sh"

[tasks.package]
description = "ZIP the verified versioned macOS release app (requires RELEASE_VERSION)"
run = "./tools/package-release.sh"

[tasks.release]
description = "Trigger the manual GitHub release workflow"
run = "gh workflow run release.yml --ref main"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.prepare]
description = "Prepare locked release-tooling dependencies before Git hooks"
run = "npm ci --ignore-scripts"
