include = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/repository-conventions/mise.toml?ref=29b8b072e41158ab12cadafbda35e868642b224e",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/security/mise.toml?ref=0de24d29d6195adecb6806103e205a202793cc0b",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/open-source-software/mise.toml?ref=4a3679d9da910272ca4d741307e4cbbe2bde6d6e",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/releasable-open-source-software/mise.toml?ref=23c098e0071e5f564a89f5980ffbd199e114fd29",
]

[task_config]
includes = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//mise-tasks/release?ref=c13b67c59b7ab4224fb2544a2de6fa2f49d36e2f",
]

[tools]
"github:please-behave/cli" = "0.19.0"
node = "26.13.1"
python = "3.15.2"
"aqua:boyter/scc" = "4.1.0"
gh = "2.104.0"
ruff = "0.17.5"

[tasks.build]
description = "Build a local macOS app bundle"
run = "./tools/build-release.sh"

[tasks.format]
description = "Format Swift, Python and shell sources"
run = [
  "swift format format --in-place --recursive Sources .please Package.swift",
  "ruff format",
  "git ls-files -z '*.sh' | xargs -0 -r shfmt -w",
]

[tasks.test-ui]
description = "Run native Settings keyboard and UI tests (macOS desktop)"
run = "./.please/checks/ui-tests/test-settings-navigation.sh"

[tasks.package]
description = "ZIP the verified versioned macOS release app (requires RELEASE_VERSION)"
run = "./tools/package-release.sh"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Nothing to fetch: the repository has no external dependencies"
run = "echo 'No dependencies to set up.'"
