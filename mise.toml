include = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/repository-conventions/mise.toml?ref=a7457cc17a1b95f8762e9ba3ddb45d9c9bd34b9d",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/security/mise.toml?ref=a7457cc17a1b95f8762e9ba3ddb45d9c9bd34b9d",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/open-source-software/mise.toml?ref=a7457cc17a1b95f8762e9ba3ddb45d9c9bd34b9d",
  "git::https://github.com/christianpflugradt/please-behave-governance.git//rulesets/releasable-open-source-software/mise.toml?ref=a7457cc17a1b95f8762e9ba3ddb45d9c9bd34b9d",
]

[task_config]
includes = [
  "git::https://github.com/christianpflugradt/please-behave-governance.git//mise-tasks/release?ref=3c8ce48cb62d27c8c300d30f361e0832516fc860",
]

[tools]
"github:please-behave/cli" = "0.16.2"
node = "26.13.1"
python = "3.15.2"
"aqua:boyter/scc" = "4.1.0"
gh = "2.104.0"
ruff = "0.17.5"

[tasks.build]
description = "Build a local macOS app bundle"
run = "./tools/build-release.sh"

[tasks.format]
description = "Format Swift, Python and shell sources"
run = [
  "swift format format --in-place --recursive Sources .please Package.swift",
  "ruff format",
  "git ls-files -z '*.sh' | xargs -0 -r shfmt -w",
]

[tasks.test-ui]
description = "Run native Settings keyboard and UI tests (macOS desktop)"
run = "./.please/checks/ui-tests/test-settings-navigation.sh"

[tasks.package]
description = "ZIP the verified versioned macOS release app (requires RELEASE_VERSION)"
run = "./tools/package-release.sh"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Nothing to fetch: the repository has no external dependencies"
run = "echo 'No dependencies to set up.'"
